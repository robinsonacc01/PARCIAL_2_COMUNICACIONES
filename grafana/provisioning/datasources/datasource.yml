apiVersion: 1

datasources:
  - name: PostgreSQL_JoomlaDB
    uid: PostgreSQL_JoomlaDB
    type: postgres
    access: proxy
    url: database:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: "disable"
      postgresVersion: 1600
    isDefault: true
    editable: true