server {
    listen 80;
    server_name localhost;

    # Aumentar tamaño máximo de subida de archivos (útil para plugins o medios en Joomla)
    client_max_body_size 100M;

    # 1. Enrutamiento a Joomla (Raíz /)
    location / {
        proxy_pass http://joomla:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Enrutamiento a Jupyter Notebook (/jupyter)
    location /jupyter/ {
        proxy_pass http://jupyter:8888/jupyter/;
        
        # Cabeceras estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración esencial para WebSockets de Jupyter (Punto Crítico)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
    }

    # 3. Enrutamiento a Grafana (/grafana)
    location /grafana/ {
        proxy_pass http://grafana:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets requeridos por los paneles en tiempo real de Grafana
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}