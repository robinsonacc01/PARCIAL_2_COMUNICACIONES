# Registro de accesos centralizado (se ve con: docker logs nginx_proxy)
log_format principal '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log principal;

# Soporte de WebSockets (Jupyter y Grafana Live)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 1) Informe: la raíz exacta "/" muestra el informe
    location = / {
        root /usr/share/nginx/informe;
        try_files /index.html =404;
    }

    # 2) Jupyter (base_url /jupyter/) con WebSockets
    location /jupyter/ {
        proxy_pass http://jupyter:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # 3) Grafana (servido desde el subpath /grafana/)
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live (WebSocket)
    location /grafana/api/live/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 4) Joomla: todo lo demás (portal en /index.php, admin en /administrator)
    location / {
        proxy_pass http://joomla:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}